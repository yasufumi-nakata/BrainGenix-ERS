openapi: 3.0.3
info:
  title: BrainGenix-ERS Management API
  version: 0.1.0-sandbox
  description: First-pass management API contract for BrainGenix-ERS.
servers:
  - url: http://127.0.0.1:8765
paths:
  /healthz:
    get:
      summary: Probe the management endpoint.
      responses:
        '200':
          description: Healthy response.
  /v1/runtime:
    get:
      summary: Return coarse runtime metadata.
      responses:
        '200':
          description: Runtime metadata returned.
  /v1/projects/current:
    get:
      summary: Return the currently loaded project summary.
      responses:
        '200':
          description: Current project returned.
  /v1/scenes/current/summary:
    get:
      summary: Return a compact summary of the current scene.
      responses:
        '200':
          description: Scene summary returned.
  /v1/logs/opengl:
    get:
      summary: Return recent OpenGL debug log items.
      responses:
        '200':
          description: OpenGL log items returned.
  /v1/rendering/shadow-maps/refresh:
    post:
      summary: Request a one-shot shadow map refresh.
      responses:
        '202':
          description: Refresh action accepted.
  /v1/rendering/server/status:
    get:
      summary: Return the current server-rendering job state.
      responses:
        '200':
          description: Server-rendering state returned.
  /v1/rendering/server/start:
    post:
      summary: Start a sandbox server-rendering job.
      responses:
        '202':
          description: Server-rendering job accepted.
  /v1/rendering/server/stop:
    post:
      summary: Stop the current sandbox server-rendering job.
      responses:
        '202':
          description: Server-rendering stop accepted.
  /v1/datacenter-loading/status:
    get:
      summary: Return the current datacenter-loading job state.
      responses:
        '200':
          description: Datacenter-loading state returned.
  /v1/datacenter-loading/start:
    post:
      summary: Start a sandbox datacenter-loading job.
      responses:
        '202':
          description: Datacenter-loading job accepted.
  /v1/datacenter-loading/cancel:
    post:
      summary: Cancel the current sandbox datacenter-loading job.
      responses:
        '202':
          description: Datacenter-loading cancellation accepted.
  /v1/projects/export:
    post:
      summary: Request a project export operation.
      responses:
        '202':
          description: Export action accepted.
